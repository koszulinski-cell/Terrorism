<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Domestic Terrorism | Today</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .top {
      background: #111;
      color: white;
      padding: 28px 22px;
    }

    .top > div {
      max-width: 1200px;
      margin: 0 auto;
    }

    .back {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      margin: 12px 0 4px;
      font-size: 38px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 0;
      color: #bbb;
      font-size: 16px;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .controls {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .controls label {
      font-weight: 700;
    }

    select {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      padding: 22px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 34px;
      font-weight: 800;
    }

    .stat-label {
      margin-top: 4px;
      color: #666;
      font-size: 14px;
    }

    .map-container {
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    #map {
      width: 100%;
      height: 650px;
      border-radius: 8px;
    }

    .about {
      background: white;
      padding: 24px;
      margin-top: 18px;
      border-radius: 12px;
      line-height: 1.6;
    }

    .about h2 {
      margin-top: 0;
    }

    .popup h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .popup p {
      margin: 7px 0;
    }

    .popup .source {
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 700px) {

      h1 {
        font-size: 30px;
      }

      main {
        padding: 12px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      #map {
        height: 500px;
      }

    }

  </style>

</head>

<body>

  <div id="app">
    Loading...
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script src="/terrorism.js"></script>

</body>

</html>
